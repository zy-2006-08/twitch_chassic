# CMSIS-DAP (DAPLink) over SWD, STM32F405 on this chassis board.
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32f4x.cfg]
adapter speed 4000

# The upstream author pinned one specific DAPLink (0x04d8:0x00df). Left commented so
# any CMSIS-DAP works; uncomment to force that exact probe again.
# cmsis_dap_vid_pid 0x04d8 0x00df

# Hardware reset line is not wired on this board.
reset_config none
